<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cetak Struk 58mm</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#d9d9d4;--ac:#1f5fbf;--acx:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#ececE8;--mut:#9a9a94;--bd:#3a3a37;--ac:#6ea2ee;--acx:#101010;--bad:#f2766e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#ececE8;--mut:#9a9a94;--bd:#3a3a37;--ac:#6ea2ee;--acx:#101010;--bad:#f2766e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.wrap{grid-template-columns:1fr 330px;align-items:start}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.x{color:var(--bad)}
.item{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.item .r3{display:grid;grid-template-columns:70px 1fr;gap:8px;margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prev{position:sticky;top:10px;text-align:center}
.prev small{display:block;color:var(--mut);margin-bottom:8px}
#receipt{width:58mm;margin:0 auto;background:#fff;color:#000;padding:var(--pt,4mm) var(--ps,5mm) var(--pb,6mm);font:var(--fs,10px)/var(--lh,1.35) "Courier New",Courier,monospace;text-align:left;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#receipt .c{text-align:center}
#receipt .w{white-space:pre-wrap;word-break:break-word}
#receipt .sep{overflow:hidden;white-space:nowrap}
#receipt .row{display:flex;justify-content:space-between;gap:4px}
#receipt .row span:last-child{text-align:right}
#receipt img{display:block;margin:0 auto 2mm;max-width:100%}
#receipt .g{height:var(--gap,3mm)}
#receipt .itm{margin-bottom:var(--ig,0mm)}
#receipt .itm .row{padding-left:var(--qi,0ch)}
#receipt .soc{display:flex;align-items:center;justify-content:center;gap:1.5mm;margin:.6mm 0}
#receipt.left .c{text-align:left}
#receipt.left .soc{justify-content:flex-start}
#receipt .soc svg{width:var(--ic,4mm);height:var(--ic,4mm);flex:none}
#receipt .kv{display:grid;grid-template-columns:9ch 1ch 1fr;margin:0 var(--ti,3mm)}
#receipt .kv span:last-child{text-align:right}
#receipt .ind{margin:0 var(--ii,0mm)}
@page{size:58mm auto;margin:0}
@media print{
 html,body{background:#fff;margin:0;padding:0}
 .card,.prev small{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 .prev{position:static}
 #receipt{box-shadow:none;margin:0}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
 <h1>Cetak Struk 58mm</h1>
 <div style="color:var(--mut);font-size:13px">Isi kolom di bawah, cek pratinjau, lalu tekan Cetak. Gunakan data transaksi yang sebenarnya.</div>

 <h2>Identitas toko</h2>
 <label>Logo (gambar otomatis jadi hitam-putih untuk thermal)</label>
 <input type="file" id="logo" accept="image/*">
 <div class="r2">
  <div><label>Lebar logo: <b id="logoWv">26</b> mm</label><input type="range" id="logoW" value="26" min="8" max="48" step="1"></div>
  <div><label>Ketajaman logo</label><input type="range" id="thr" min="60" max="220" value="150"></div>
 </div>
 <label>Nama toko / cabang</label><input id="store" placeholder="Nama toko">
 <label>Alamat</label><textarea id="addr" placeholder="Alamat lengkap"></textarea>

 <h2>Barang</h2>
 <div id="items"></div>
 <button id="add">+ Tambah barang</button>

 <h2>Pembayaran</h2>
 <div class="r2">
  <div><label>Metode bayar</label><input id="method" placeholder="TUNAI / QRIS / DEBIT"></div>
  <div><label>Dibayar (kosong = pas)</label><input id="paid" type="number" min="0" placeholder="otomatis"></div>
 </div>

 <h2>Info transaksi</h2>
 <div class="r2">
  <div><label>Tanggal &amp; jam</label><input id="dt" type="datetime-local"></div>
  <div><label>Kasir</label><input id="cashier"></div>
 </div>
 <label>No. referensi / nota</label><input id="ref">

 <h2>Footer</h2>
 <label>Catatan kebijakan (tiap baris = satu baris struk)</label><textarea id="note" placeholder="Contoh: Barang yang sudah dibeli tidak dapat ditukar"></textarea>
 <label>NPWP (opsional)</label><input id="npwp">
 <label>Ucapan penutup</label><input id="thanks" value="Terima Kasih">
 <label>Sosmed / kontak (ikon + teks, bisa ditambah atau dikurangi)</label>
 <div id="socials"></div>
 <button id="addsoc">+ Tambah sosmed</button>

 <h2>Pengaturan layout</h2>
 <div class="r2">
  <div><label>Ukuran font (px)</label><input id="fs" type="number" step="0.5" value="10"></div>
  <div><label>Tinggi baris</label><input id="lh" type="number" step="0.05" value="1.35"></div>
  <div><label>Margin kiri-kanan (mm)</label><input id="ps" type="number" step="0.5" value="5"></div>
  <div><label>Margin atas (mm)</label><input id="pt" type="number" step="0.5" value="4"></div>
  <div><label>Margin bawah (mm)</label><input id="pb" type="number" step="0.5" value="6"></div>
  <div><label>Jarak antar blok (mm)</label><input id="gap" type="number" step="0.5" value="3"></div>
  <div><label>Jarak antar barang (mm)</label><input id="ig" type="number" step="0.5" value="0"></div>
  <div><label>Indent baris qty (karakter)</label><input id="qi" type="number" step="1" value="0"></div>
  <div><label>Karakter garis</label><input id="sepch" value="=" maxlength="1"></div>
  <div><label>Panjang garis (karakter)</label><input id="cols" type="number" value="32"></div>
  <div><label>Ukuran ikon sosmed: <b id="iconv">4</b> mm</label><input id="icon" type="range" min="2" max="10" step="0.5" value="4"></div>
  <div><label>Rata teks header/footer</label><select id="hal"><option value="center">Tengah</option><option value="left">Kiri</option></select></div>
  <div><label>Indent blok total (mm)</label><input id="ti" type="number" step="0.5" value="3"></div>
  <div><label>Indent blok info (mm)</label><input id="ii" type="number" step="0.5" value="0"></div>
 </div>

 <div class="bar">
  <button class="p" id="print">Cetak</button>
  <button id="save">Simpan profil toko</button>
  <button class="x" id="reset">Kosongkan transaksi</button>
  <button id="exp">Ekspor profil</button>
  <button id="imp">Impor profil</button>
  <input type="file" id="impf" accept=".json,application/json" hidden>
 </div>
</div>

<div class="prev">
 <small>Pratinjau (lebar kertas 58mm)</small>
 <div id="receipt"></div>
</div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var items=[{sku:"",name:"",qty:1,price:0}];
var logoData="";
var profileKeys=["store","addr","note","npwp","thanks","logoW","thr","method","fs","lh","ps","pt","pb","gap","ig","qi","sepch","cols","icon","hal","ti","ii"];
var socials=[{t:"instagram",v:""}];
var G='fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
var ICON={
 instagram:'<rect x="5" y="5" width="14" height="14" rx="4" '+G+'/><circle cx="12" cy="12" r="3.2" '+G+'/><circle cx="16.3" cy="7.7" r="1.1" fill="#fff"/>',
 tiktok:'<path d="M13 5v9.5a2.5 2.5 0 1 1-2.5-2.5M13 5c.3 2 1.7 3.4 4 3.6" '+G+'/>',
 whatsapp:'<path d="M12 5a7 7 0 0 0-6 10.5L5 19l3.6-1A7 7 0 1 0 12 5z" '+G+'/><path d="M9.5 9.5c0 3 2 5 5 5l.8-1.4-1.6-.9-.7.7c-.9-.4-1.6-1.1-2-2l.7-.7-.9-1.6z" fill="#fff"/>',
 facebook:'<path d="M13.5 19v-6h2l.4-2.4h-2.4V9.2c0-.7.3-1.1 1.2-1.1h1.3V6a14 14 0 0 0-1.8-.1c-1.8 0-3 1.1-3 3v1.7H9v2.4h2.2v6z" fill="#fff"/>',
 youtube:'<rect x="4.5" y="7" width="15" height="10" rx="3" '+G+'/><path d="M10.5 9.8v4.4l3.8-2.2z" fill="#fff"/>',
 x:'<path d="M6 6l12 12M18 6L6 18" '+G+'/>',
 telepon:'<path d="M8 5.5l2 3-1.3 1.6c.9 1.8 2.3 3.2 4.1 4.1l1.6-1.3 3 2-.6 2.2c-.2.6-.8 1-1.4.9C9.8 17.6 6.4 14.2 5.5 8.8c-.1-.6.3-1.2.9-1.4z" fill="#fff"/>',
 web:'<circle cx="12" cy="12" r="7" '+G+'/><ellipse cx="12" cy="12" rx="3" ry="7" '+G+'/><path d="M5 12h14" '+G+'/>'
};
var SOCNAMES=[["instagram","Instagram"],["tiktok","TikTok"],["whatsapp","WhatsApp"],["facebook","Facebook"],["youtube","YouTube"],["x","X (Twitter)"],["telepon","Telepon"],["web","Website"],["none","Tanpa ikon"]];
function iconSvg(t){return ICON[t]?'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#000"/>'+ICON[t]+'</svg>':''}
function renderSocials(){
 var h="";
 socials.forEach(function(s,i){
  h+='<div class="item"><div class="r2"><select data-si="'+i+'" data-sk="t">'+SOCNAMES.map(function(n){return'<option value="'+n[0]+'"'+(n[0]===s.t?' selected':'')+'>'+n[1]+'</option>'}).join("")+'</select><input data-si="'+i+'" data-sk="v" placeholder="@akun / nomor / alamat web" value="'+esc(s.v)+'"></div><div style="text-align:right;margin-top:6px"><button class="x" data-sdel="'+i+'">Hapus</button></div></div>';
 });
 $("socials").innerHTML=h;
}
function applyLayout(){
 var r=$("receipt"),s=r.style;
 s.setProperty("--fs",($("fs").value||10)+"px");s.setProperty("--lh",$("lh").value||1.35);
 s.setProperty("--ps",($("ps").value||0)+"mm");s.setProperty("--pt",($("pt").value||0)+"mm");s.setProperty("--pb",($("pb").value||0)+"mm");
 s.setProperty("--gap",($("gap").value||0)+"mm");s.setProperty("--ig",($("ig").value||0)+"mm");
 s.setProperty("--qi",($("qi").value||0)+"ch");s.setProperty("--ti",($("ti").value||0)+"mm");s.setProperty("--ii",($("ii").value||0)+"mm");s.setProperty("--ic",($("icon").value||4)+"mm");
 r.className=$("hal").value==="left"?"left":"";
 $("iconv").textContent=$("icon").value;$("logoWv").textContent=$("logoW").value;
}
function getProfile(){var pr={logoData:logoData,socials:socials};profileKeys.forEach(function(k){pr[k]=$(k).value});return pr}
function setProfile(pr){
 profileKeys.forEach(function(k){if(pr[k]!=null)$(k).value=pr[k]});
 logoData=pr.logoData||"";
 if(Array.isArray(pr.socials))socials=pr.socials;
 renderSocials();render();
}

function fmt(n){return (Math.round(n)||0).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function pad(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fdt(v){if(!v)return"";var d=new Date(v);if(isNaN(d))return"";var p=function(n){return String(n).padStart(2,"0")};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}

function renderItems(){
 var h="";
 items.forEach(function(it,i){
  h+='<div class="item"><div class="r2"><input data-i="'+i+'" data-k="sku" placeholder="Kode (opsional)" value="'+esc(it.sku)+'"><input data-i="'+i+'" data-k="name" placeholder="Nama barang" value="'+esc(it.name)+'"></div>'+
  '<div class="r3"><input data-i="'+i+'" data-k="qty" type="number" min="1" value="'+it.qty+'"><input data-i="'+i+'" data-k="price" type="number" min="0" placeholder="Harga satuan" value="'+(it.price||"")+'"></div>'+
  (items.length>1?'<div style="text-align:right;margin-top:6px"><button class="x" data-del="'+i+'">Hapus</button></div>':'')+'</div>';
 });
 $("items").innerHTML=h;
}

function lines(v){return v.split("\n").map(function(s){return s.trim()}).filter(Boolean)}
function kv(a,b){return'<div class="kv"><span>'+a+'</span><span>:</span><span>'+b+'</span></div>'}

function render(){
 var tot=0,h="";applyLayout();
 if(logoData)h+='<img src="'+logoData+'" style="width:'+(+$("logoW").value||26)+'mm" alt="">';
 if($("store").value)h+='<div class="c w"><b>'+esc($("store").value.toUpperCase())+'</b></div>';
 if($("addr").value.trim())h+='<div class="c w">'+esc($("addr").value.trim())+'</div>';
 var sep='<div class="sep">'+Array((+$("cols").value||32)+1).join(($("sepch").value||"=").charAt(0))+'</div>';
 h+=sep;
 items.forEach(function(it){
  if(!it.name&&!it.sku&&!it.price)return;
  var q=+it.qty||1,p=+it.price||0,s=q*p;tot+=s;
  h+='<div class="itm"><div class="w">'+esc((it.sku?it.sku+" : ":"")+it.name.toUpperCase())+'</div>'+
     '<div class="row"><span>'+q+' x '+fmt(p)+' =</span><span>'+fmt(s)+'</span></div></div>';
 });
 h+=sep+'<div class="g"></div>';
 h+=kv("TOTAL",fmt(tot));
 var m=$("method").value.trim().toUpperCase();
 var paid=$("paid").value===""?tot:(+$("paid").value||0);
 if(m)h+=kv(esc(m),fmt(paid));
 if(paid>tot)h+=kv("KEMBALI",fmt(paid-tot));
 h+='<div class="g"></div>';
 var d=fdt($("dt").value);
 if(d)h+='<div class="w ind">#Tgl.Jam : '+d+'</div>';
 if($("cashier").value)h+='<div class="w ind">#Kasir   : '+esc($("cashier").value.toUpperCase())+'</div>';
 if($("ref").value)h+='<div class="w ind">#Ref     : '+esc($("ref").value)+'</div>';
 var nl=lines($("note").value);
 if(nl.length){h+='<div class="g"></div>'+nl.map(function(l){return'<div class="c w">'+esc(l)+'</div>'}).join("")}
 if($("npwp").value)h+='<div class="g"></div><div class="c w">NPWP '+esc($("npwp").value)+'</div>';
 if($("thanks").value)h+='<div class="g"></div><div class="c w">'+esc($("thanks").value)+'</div>';
 var sl=socials.filter(function(s){return s.v.trim()});
 if(sl.length)h+='<div class="g"></div>'+sl.map(function(s){return'<div class="soc">'+iconSvg(s.t)+'<span class="w">'+esc(s.v)+'</span></div>'}).join("");
 $("receipt").innerHTML=h;
}

$("items").addEventListener("input",function(e){
 var t=e.target,i=t.dataset.i,k=t.dataset.k;if(i==null)return;
 items[i][k]=(k==="qty"||k==="price")?(+t.value||0):t.value;render();
});
$("items").addEventListener("click",function(e){
 var d=e.target.dataset.del;if(d==null)return;
 items.splice(+d,1);renderItems();render();
});
$("add").onclick=function(){items.push({sku:"",name:"",qty:1,price:0});renderItems();render()};
document.querySelectorAll("input:not([data-i]),textarea,select").forEach(function(el){el.addEventListener("input",render)});

$("logo").addEventListener("change",function(){
 var f=this.files[0];if(!f)return;
 var img=new Image(),u=URL.createObjectURL(f);
 img.onload=function(){convert(img);URL.revokeObjectURL(u)};
 img.src=u;
});
function socUpd(e){var t=e.target,i=t.dataset.si;if(i==null)return;socials[i][t.dataset.sk]=t.value;render()}
$("socials").addEventListener("input",socUpd);
$("socials").addEventListener("change",socUpd);
$("socials").addEventListener("click",function(e){var d=e.target.dataset.sdel;if(d==null)return;socials.splice(+d,1);renderSocials();render()});
$("addsoc").onclick=function(){socials.push({t:"instagram",v:""});renderSocials();render()};
$("exp").onclick=function(){var b=new Blob([JSON.stringify(getProfile(),null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="profil-struk.json";a.click()};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{setProfile(JSON.parse(r.result))}catch(e){alert("File profil tidak valid.")}};r.readAsText(f)};
var lastImg=null;
function convert(img){
 lastImg=img;
 var W=Math.min(384,img.width),H=Math.round(img.height*W/img.width);
 var c=document.createElement("canvas");c.width=W;c.height=H;
 var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
 var d=x.getImageData(0,0,W,H),t=+$("thr").value;
 for(var i=0;i<d.data.length;i+=4){
  var g=0.3*d.data[i]+0.59*d.data[i+1]+0.11*d.data[i+2];
  var v=g<t?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;
 }
 x.putImageData(d,0,0);logoData=c.toDataURL("image/png");render();
}
$("thr").addEventListener("input",function(){if(lastImg)convert(lastImg)});

$("print").onclick=function(){render();window.print()};
$("save").onclick=function(){
 try{
  var o=getProfile();
  localStorage.setItem("struk58profile",JSON.stringify(o));alert("Profil toko tersimpan di browser ini.");
 }catch(e){alert("Penyimpanan tidak tersedia di browser ini.")}
};
$("reset").onclick=function(){
 items=[{sku:"",name:"",qty:1,price:0}];["paid","cashier","ref"].forEach(function(k){$(k).value=""});
 $("dt").value=pad();renderItems();render();
};

try{
 var s=localStorage.getItem("struk58profile");
 if(s){setProfile(JSON.parse(s))}
}catch(e){}
$("dt").value=pad();
renderSocials();renderItems();render();
})();
</script>
</body>
</html>
